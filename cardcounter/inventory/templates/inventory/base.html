{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokébulk Tracker</title>
    {% tailwind_css %}
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Bulk</a>
        <a href="{% url 'cards' %}">Cards</a>
        <a href="{% url 'totals' %}">Totals</a>
    </nav>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li style="color: red;">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <hr>
    {% block content %}
    {% endblock %}
</body>
</html>
