{% extends "inventory/base.html" %}

{% block content %}
<body>
    <h1>Bulk Counts</h1>

    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Rarity</th>
                <th>Current Quantity</th>
                <th>Enter Amount</th>
            </tr>
            {% for bulk in bulk_counts %}
            <tr>
                <td>{{ bulk.get_rarity_display }}</td>
                <td>{{ bulk.quantity }}</td>
                <td>
                    <input type="number" name="quantity_{{ bulk.rarity }}" min="0">
                </td>
            </tr>
            {% endfor %}
        </table>

        <button type="submit" name="action" value="add">Add</button>
        <button type="submit" name="action" value="remove">Remove</button>
        <button type="submit" name="action" value="set">Change Count</button>
    </form>
{% endblock %}
