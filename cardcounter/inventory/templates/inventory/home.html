{% extends "inventory/base.html" %}

{% block content %}
<h1 class="text-3xl  text-red-600 dark:text-red-400 mb-6 text-center pt-4" style="font-family: 'Fredoka', sans-serif;">Bulk Counts</h1>

<form method="post" class="space-y-6">
    {% csrf_token %}
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-yellow-400 dark:bg-yellow-600 text-red-900 dark:text-gray-900">
                <tr>
                    <th class="px-4 py-3 font-bold">Rarity</th>
                    <th class="px-4 py-3 font-bold">Current Quantity</th>
                    <th class="px-4 py-3 font-bold">Enter Amount</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:hover:bg-gray-700">
                {% for bulk in bulk_counts %}
                <tr class="{% cycle 'bg-white dark:bg-gray-800' 'bg-yellow-50 dark:bg-gray-700' %} hover:bg-yellow-100 dark:hover:bg-gray-600 transition">
                    <td class="px-4 py-3">{{ bulk.get_rarity_display }}</td>
                    <td class="px-4 py-3 font-semibold">{{ bulk.quantity }}</td>
                    <td class="px-4 py-3">
                        <input type="number" name="quantity_{{ bulk.rarity }}" min="0"
                            class="w-28 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-red-500">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="flex gap-3">
        <button type="submit" name="action" value="add"
            class="bg-green-600 hover:bg-green-700 text-white font-semibold px-5 py-2 rounded-full shadow transition">Add</button>
        <button type="submit" name="action" value="remove"
            class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2 rounded-full shadow transition">Remove</button>
        <button type="submit" name="action" value="set"
            class="bg-yellow-500 hover:bg-yellow-600 text-red-900 font-semibold px-5 py-2 rounded-full shadow transition">Change
            Count</button>
    </div>
</form>
{% endblock %}
