{% extends "inventory/base.html" %}

{% block content %}
<h1 class="text-3xl font-bold text-red-600 dark:text-red-400 mb-6 text-center pt-4" style="font-family: 'Fredoka', sans-serif;">Import Known Cards</h1>

<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-6 max-w-md mx-auto">
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py=2 rounded-full shadow transition">
            Input
        </button>
    </form>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-4">
        CSV columns expected: <code>name, card_number, rarity</code>
    </p>
</div>
{% endblock %}
